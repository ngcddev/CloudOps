# Permisos de Prometheus (spec 008, T22): solo leer los Services para descubrir los sitios.
# Es un componente de plataforma leyendo dentro del clúster; el Hub sigue sin hablar con Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-descubrir-servicios
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-descubrir-servicios
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-descubrir-servicios
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
