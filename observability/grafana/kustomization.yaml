# Grafana (spec 008, T26): explorar métricas y registros. Los dashboards son de la spec 010.
# El usuario administrador sale del Secret grafana-admin (gitops/hub/crear-secretos.sh), nunca del repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - ingress.yaml
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
