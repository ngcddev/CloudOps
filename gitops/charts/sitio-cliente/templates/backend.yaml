{{- if .Values.backend.habilitado }}
# Backend del formulario (plantilla landing_form): FastAPI sin root en el puerto 8000; el Ingress le manda /api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "sitio.namespace" . }}
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false   # no usa la API de Kubernetes: sin token montado (spec 017, T06)
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ .Values.backend.imagen.repositorio }}:{{ .Values.backend.imagen.etiqueta }}
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # solo escribe en los emptyDir de abajo (spec 018, T06)
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }                      # base SQLite de demostración (CONTACT_DB_PATH)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ include "sitio.namespace" . }}
  annotations:
    hub/metrics: "true"
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
