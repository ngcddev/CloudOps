# Un ServiceAccount por aplicación del Hub, sin token montado (spec 022, T37; auditoría K8-15). Antes todas usaban `default`: el día que un Pod necesite un permiso
# de Kubernetes se le daría a ese ServiceAccount compartido y lo heredarían todos. Hoy ninguna lo necesita (el Hub no habla con Kubernetes), así que no llevan permisos.
apiVersion: v1
kind: ServiceAccount
metadata: { name: api, namespace: hub }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: web, namespace: hub }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: voz, namespace: hub }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: postgres, namespace: hub }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: hub-db-backup, namespace: hub }
automountServiceAccountToken: false
---
# Si el nodo se queda sin memoria, se desaloja primero lo demás y al final la API y la base (auditoría K8-15)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: hub-critico }
value: 100000
globalDefault: false
description: "La API y la base del Hub: lo último que se desaloja."
