# Límites por defecto: sin esto, un Pod sin límites no entraría en una cuota de `limits.*` (spec 003 T07).
apiVersion: v1
kind: LimitRange
metadata:
  name: defecto
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 50m
        memory: 32Mi
