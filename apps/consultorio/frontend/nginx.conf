# Nginx del sitio de Dental Popayán (copia de la plantilla landing-form): sirve la página, expone /health y pasa /api al backend.
# Es una plantilla: la imagen de nginx-unprivileged reemplaza ${APP_VERSION} y ${API_UPSTREAM}
# al arrancar (archivos en /etc/nginx/templates/). Las variables propias de Nginx no se tocan.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # v1 = versión sana; v2 = versión rota a propósito (500 en / y en /health) para la demo.
    set $app_version "${APP_VERSION}";

    # Estado y versión del sitio; lo usan el monitoreo y la readiness probe.
    location = /health {
        default_type application/json;
        if ($app_version = "v2") {
            return 500 '{"status":"error","version":"v2"}';
        }
        return 200 '{"status":"ok","version":"${APP_VERSION}"}';
    }

    # El formulario se envía al backend (en compose, el servicio <cliente>-api:8000).
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        if ($app_version = "v2") {
            return 500;
        }
        try_files $uri $uri/ /index.html;
    }
}
