# Consola de agencia del Hub (spec 003 T17): React compilado servido por Nginx sin root en el 8080.
# Las llamadas a /api las enruta el Ingress directamente a la API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hub
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false   # no usa la API de Kubernetes: sin token montado (spec 017, T06)
      serviceAccountName: web
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 32Mi } }
      containers:
        - name: web
          image: gitea.hub.local/forja-digital/hub-web:v1.11
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # nginx sin root escribe su pid y sus temporales en /tmp (auditoría K8-08)
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # /health de nginx (auditoría CT-10): responde sin servir index.html
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hub
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
