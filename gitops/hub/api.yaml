# API del Hub (spec 003 T17): FastAPI sin root en el puerto 8000. Al arrancar aplica las migraciones
# y carga los datos semilla si la base está vacía. DATABASE_URL viene del Secret hub-db y las claves
# de sesión del Secret hub-auth (spec 007).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hub
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gitea.hub.local/forja-digital/hub-api:v1.2
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hub-db
                  key: DATABASE_URL
            # Sesiones (spec 007): clave de firma del token y contraseña de los usuarios sembrados, del
            # Secret hub-auth (ver crear-secretos.sh). Sin él la API no arranca: es a propósito.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: hub-auth, key: JWT_SECRET }
            - name: SEED_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: hub-auth, key: SEED_USER_PASSWORD }
            # Gitea y Argo CD (spec 005): el Hub escribe en hub-gitops y lee el estado de Argo CD.
            # Los tokens vienen del Secret hub-gitops-tokens (ver crear-tokens.sh); sin él la API
            # arranca igual y los cambios por GitOps quedan sin conexión.
            - { name: GITEA_URL, value: "http://gitea.gitea.svc:3000" }
            - { name: GITEA_REPO, value: "forja-digital/hub-gitops" }
            - { name: ARGOCD_URL, value: "http://argocd-server.argocd.svc" }
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-gitops-tokens, key: GITEA_TOKEN, optional: true }
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-gitops-tokens, key: ARGOCD_TOKEN, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }   # ok solo si la base contesta
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hub
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
