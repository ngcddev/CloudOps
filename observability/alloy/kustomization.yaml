# Grafana Alloy (spec 008, T25): recoge los registros de los Pods de los clientes y los manda a Loki.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rbac.yaml
  - deployment.yaml
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
