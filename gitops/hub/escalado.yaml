# Escalado y disponibilidad del Hub (spec 016): HPA por CPU para la API y la web, y un PodDisruptionBudget para cada una.
# metrics-server viene con k3s. Máximo 2 réplicas porque el nodo es pequeño. La tarea en segundo plano de la API (el vigilante de Argo CD) y
# el arranque (migraciones y semilla) toman un candado de PostgreSQL (app/services/bloqueos.py): con 2 réplicas lo hace una sola a la vez.
# PostgreSQL no se escala: es un solo StatefulSet con su respaldo.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: hub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # no se achica ante un pico corto
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: hub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
# Con `minAvailable: 1` y una sola réplica (HPA con mínimo 1) `kubectl drain` quedaba bloqueado para siempre y la actualización de k3s con él (auditoría K8-12).
# `maxUnavailable: 1` deja drenar el nodo único; con dos réplicas sigue sin retirar las dos a la vez.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: hub
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: hub
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app: web }
