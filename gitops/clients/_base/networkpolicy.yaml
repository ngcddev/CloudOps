# Aislamiento de red del cliente (spec 003 T08): deniega toda entrada y solo deja pasar a Traefik
# (kube-system) y a Prometheus/Blackbox (monitoring). Así un sitio no puede llegar al de otro cliente,
# ni siquiera desde su propio namespace salvo por lo que se permite abajo.
# Dentro del mismo namespace los Pods sí se hablan (el frontend del consultorio llama a su backend).
# Salida (spec 022, T14; auditoría K8-02): también se deniega toda salida y solo se deja el DNS (CoreDNS en kube-system) y los Pods del mismo cliente. Un sitio no
# necesita más: sus métricas las lee Prometheus (entrada) y sus registros los lee Alloy por la API de Kubernetes. Un Pod comprometido no llega a Loki, Prometheus,
# Alertmanager, MLflow, Gitea ni a internet. gitops/pruebas/salida-red.sh lo comprueba en el clúster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-traefik-monitoreo-y-propio
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system   # Traefik, el Ingress de k3s
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring    # Prometheus y Blackbox Exporter
        - podSelector: {}                                # los Pods del mismo cliente
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-dns-y-propio
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns          # CoreDNS: resolver nombres
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector: {}                # los Pods del mismo cliente (el frontend llama a su backend)
