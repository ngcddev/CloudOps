# Dependabot (spec 018, T01): vigila las dependencias y las imágenes base y propone PR con las actualizaciones, para que una vulnerabilidad publicada no espere a la
# próxima revisión manual. Semanal y agrupado para no inundar de PR; las imágenes se anclan por etiqueta y se actualizan a mano si la etiqueta cambia de rama mayor.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/backend", "/ai", "/apps/consultorio/backend", "/apps/colegio/backend", "/apps/templates/landing-form/backend"]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: ["/backend", "/frontend", "/apps/restaurante", "/apps/ferreteria", "/apps/consultorio", "/apps/colegio", "/ai/servidor-mlflow", "/pipelines/runner"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
