# Entorno de desarrollo del Hub: un solo comando levanta todo (docker compose up --build).
# Responsable: Sistemas 3 (DevSecOps). Cada servicio lo agrega quien tiene su Dockerfile listo.
# Antes de la primera vez:  cp .env.example .env

services:
  # Base de datos del Hub (spec 001)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta .env; copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta .env; copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta .env; copia .env.example a .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API del Hub (spec 001): FastAPI en :8000, espera a que la base esté sana
  api:
    build:
      context: ./backend
      # seed/ entra a la imagen: la API lo carga la primera vez que la base está vacía
      additional_contexts:
        seed: ./seed
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta .env; copia .env.example a .env}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Consola de agencia (spec 001): nginx en :5173 (dentro del contenedor, 8080)
  web:
    build:
      context: ./frontend
      # seed/ entra a la imagen como datos de prueba mientras la API no responde
      additional_contexts:
        seed: ./seed
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      - api

  # ---------- Sitios de los clientes (spec 002) ----------
  # La versión se fija en build (v1 = sana, v2 = rota con HTTP 500). Para pasar un sitio a v2:
  #   RESTAURANTE_VERSION=v2 docker compose up --build -d restaurante

  # Sitio de La Sazón (plantilla landing) en :8081
  restaurante:
    build:
      context: ./apps/restaurante
      args:
        APP_VERSION: ${RESTAURANTE_VERSION:-v1}
    image: hub/restaurante:${RESTAURANTE_VERSION:-v1}
    ports:
      - "${RESTAURANTE_PORT:-8081}:8080"

  # Sitio de El Tornillo (plantilla landing) en :8082
  ferreteria:
    build:
      context: ./apps/ferreteria
      args:
        APP_VERSION: ${FERRETERIA_VERSION:-v1}
    image: hub/ferreteria:${FERRETERIA_VERSION:-v1}
    ports:
      - "${FERRETERIA_PORT:-8082}:8080"

  # Pendiente del módulo 1:
  # consultorio-web  → spec 002-T10 (:8083) y consultorio-api

volumes:
  db_data:
