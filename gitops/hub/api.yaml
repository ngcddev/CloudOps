# API del Hub (spec 003 T17): FastAPI sin root en el puerto 8000. Al arrancar aplica las migraciones
# y carga los datos semilla si la base está vacía. DATABASE_URL viene del Secret hub-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hub
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gitea.hub.local/forja-digital/hub-api:v1
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hub-db
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }   # ok solo si la base contesta
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hub
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
