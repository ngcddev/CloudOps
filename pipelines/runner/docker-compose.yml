# Runner de Gitea Actions para la puerta de seguridad (spec 006, T02). Va en un equipo con Docker FUERA del
# PC A (tech-stack: las compilaciones no deben quitarle memoria al clúster).
#
#   GITEA_INSTANCE_URL=http://gitea.hub.local \
#   GITEA_RUNNER_REGISTRATION_TOKEN=<token de Gitea> \
#   docker compose -f pipelines/runner/docker-compose.yml up -d --build
#
# El token sale de Gitea: Administración del sitio → Actions → Runners → «Crear nuevo runner» (o de la API:
# GET /api/v1/admin/runners/registration-token). No se guarda en el repositorio.
# Si el nombre de Gitea solo se resuelve con una entrada de hosts, agrégala en `extra_hosts` (abajo).
services:
  runner:
    build: .
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL:?Falta GITEA_INSTANCE_URL (por ejemplo http://gitea.hub.local)}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?Falta el token de registro del runner}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-runner-puerta}
      # `puerta` es la etiqueta que pide el workflow (runs-on: puerta); `host` = los pasos corren en este contenedor
      GITEA_RUNNER_LABELS: puerta:host
      CONFIG_FILE: /config.yaml
    volumes:
      - ./config.yaml:/config.yaml:ro
      - runner_datos:/data
      # El Docker del equipo, para lanzar las herramientas como contenedores hermanos
      - /var/run/docker.sock:/var/run/docker.sock
      # Misma ruta dentro y fuera (ver config.yaml)
      - /tmp/puerta-trabajo:/tmp/puerta-trabajo
    # Ejemplo para un Gitea que solo se resuelve por hosts:
    # extra_hosts:
    #   - "gitea.hub.local:172.30.0.1"

volumes:
  runner_datos:
