# API del Hub (spec 003 T17): FastAPI sin root en el puerto 8000. Al arrancar aplica las migraciones
# y carga los datos semilla si la base está vacía. DATABASE_URL viene del Secret hub-db y las claves
# de sesión del Secret hub-auth (spec 007).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: hub
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false   # no usa la API de Kubernetes: sin token montado (spec 017, T06)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: gitea.hub.local/forja-digital/hub-api:v1.14
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hub-db
                  key: DATABASE_URL
            # Sesiones (spec 007): clave de firma del token y contraseña de los usuarios sembrados, del
            # Secret hub-auth (ver crear-secretos.sh). Sin él la API no arranca: es a propósito.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: hub-auth, key: JWT_SECRET }
            - name: SEED_USER_PASSWORD
              valueFrom:
                secretKeyRef: { name: hub-auth, key: SEED_USER_PASSWORD }
            # Puerta de seguridad (spec 006): token con el que el pipeline de Gitea Actions cuenta sus resultados.
            # Sin el Secret hub-pipeline la API arranca igual, pero no acepta eventos (nada se puede aprobar).
            - name: PIPELINE_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-pipeline, key: PIPELINE_TOKEN, optional: true }
            # Gitea y Argo CD (spec 005): el Hub escribe en hub-gitops y lee el estado de Argo CD.
            # Los tokens vienen del Secret hub-gitops-tokens (ver crear-tokens.sh); sin él la API
            # arranca igual y los cambios por GitOps quedan sin conexión.
            - { name: GITEA_URL, value: "http://gitea.gitea.svc:3000" }
            - { name: GITEA_REPO, value: "forja-digital/hub-gitops" }
            - { name: ARGOCD_URL, value: "http://argocd-server.argocd.svc" }
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-gitops-tokens, key: GITEA_TOKEN, optional: true }
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-gitops-tokens, key: ARGOCD_TOKEN, optional: true }
            # Webhook de Alertmanager (spec 008): token del Secret hub-alertmanager (ver crear-secretos.sh).
            # Sin el Secret la API arranca igual, pero no acepta avisos de caída.
            - name: ALERTMANAGER_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-alertmanager, key: token, optional: true }
            # Enlaces del detalle del incidente (spec 008): direcciones que abre el navegador del técnico
            - { name: GRAFANA_URL, value: "http://grafana.hub.local" }
            - { name: GITEA_PUBLIC_URL, value: "http://gitea.hub.local" }
            # Dashboards y métricas (spec 010): la API consulta Prometheus (jobs `sitios` y Traefik) para los
            # KPIs de disponibilidad y latencia; con la URL vacía el panel responde «sin datos».
            - { name: PROMETHEUS_URL, value: "http://prometheus.monitoring.svc:9090" }
            # Registros de los Pods de los clientes como evidencia del diagnóstico con IA (spec 019); con la URL vacía el diagnóstico usa solo métricas
            - { name: LOKI_URL, value: "http://loki.monitoring.svc:3100" }
            # Voz del asistente (spec 021): el servicio de voz (voz.yaml) transcribe y sintetiza; el token es el del Secret hub-voz. Sin el servicio la voz queda no disponible y el asistente sigue por texto.
            - { name: VOZ_URL, value: "http://voz.hub.svc:8100" }
            - name: VOZ_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-voz, key: VOZ_TOKEN, optional: true }
            # Trazas (OpenTelemetry): la API manda spans a Tempo (observability/tempo). Sin Tempo la API sigue igual; solo se pierden las trazas.
            # Los spans llevan tiempos y estados, nunca el texto de las preguntas ni de las respuestas.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc:4318"
          # Asistente local (spec 012): OLLAMA_URL, OLLAMA_MODEL, OLLAMA_EMBED_MODEL, ASSISTANT_CONTEXT_MODE (completo | recuperacion | rag),
          # RAG_TOP_K y RAG_MIN_SCORE salen del ConfigMap hub-ia, que crea gitops/hub/configurar-ia.sh con la IP del PC B (no va en el
          # repo). Sin el ConfigMap la API arranca igual y el asistente avisa que la IA no está disponible.
          envFrom:
            - configMapRef: { name: hub-ia, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Arranque (alembic y la semilla): hasta 150 s (30 × 5) antes de que empiecen la readiness y la liveness; sustituye a la espera fija de 40 s
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health, port: http }   # ok solo si la base contesta: sin base la API sale del Service, pero no se reinicia
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3   # el valor por defecto (1 s) marcaba la API como caída ante cualquier pausa corta (auditoría BE-01)
          livenessProbe:
            httpGet: { path: /livez, port: http }   # solo dice si el proceso responde; con /health un reinicio de PostgreSQL mataba la API en bucle (auditoría K8-03)
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hub
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
