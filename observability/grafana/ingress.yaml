# Ingress de Grafana: grafana.hub.local (spec 008, T26). Es la dirección de GRAFANA_URL en la API del Hub.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.hub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
