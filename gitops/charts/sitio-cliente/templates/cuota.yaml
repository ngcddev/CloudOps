# Tope de CPU y memoria = cuota del plan; el LimitRange da límites por defecto para que un Pod sin límites entre en la cuota.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: plan
  namespace: {{ include "sitio.namespace" . }}
spec:
  hard:
    limits.cpu: {{ .Values.cuota.cpu }}
    limits.memory: {{ .Values.cuota.memoria }}
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defecto
  namespace: {{ include "sitio.namespace" . }}
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 50m
        memory: 32Mi
