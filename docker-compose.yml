# Entorno de desarrollo del Hub: un solo comando levanta todo (docker compose up --build).
# Responsable: Sistemas 3 (DevSecOps). Cada servicio lo agrega quien tiene su Dockerfile listo.
# Antes de la primera vez:  cp .env.example .env

services:
  # Base de datos del Hub (spec 001)
  db:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 512m
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta .env; copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta .env; copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta .env; copia .env.example a .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API del Hub (spec 001): FastAPI en :8000, espera a que la base esté sana
  api:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 384m
    build:
      context: ./backend
      # Desarrollo: la imagen lleva pytest y las pruebas (docker compose exec api pytest). Producción es la etapa final.
      target: dev
      # seed/ entra a la imagen: la API lo carga la primera vez que la base está vacía
      additional_contexts:
        seed: ./seed
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta .env; copia .env.example a .env}
      # Sesiones (spec 007)
      JWT_SECRET: ${JWT_SECRET:?Falta .env; copia .env.example a .env}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Falta .env; copia .env.example a .env}
      # Puerta de seguridad (spec 006): vacío = la API no acepta eventos del pipeline
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:-}
      # GitOps (spec 005): vacíos = la API arranca sin conexión con Gitea ni Argo CD
      GITEA_URL: ${GITEA_URL:-}
      GITEA_REPO: ${GITEA_REPO:-forja-digital/hub-gitops}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      ARGOCD_URL: ${ARGOCD_URL:-}
      ARGOCD_TOKEN: ${ARGOCD_TOKEN:-}
      # Enlaces del detalle del incidente (spec 008): vacíos = sin enlaces
      GRAFANA_URL: ${GRAFANA_URL:-}
      GITEA_PUBLIC_URL: ${GITEA_PUBLIC_URL:-}
      # Webhook de Alertmanager (spec 008): vacío = la API no acepta avisos
      ALERTMANAGER_TOKEN: ${ALERTMANAGER_TOKEN:-}
      # Dashboards y métricas (spec 010): la API consulta Prometheus para disponibilidad y latencia
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      # Asistente local (spec 012): vacío = sin IA; la compuerta responde igual a lo ajeno al Hub
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      # RAG (spec 012): completo | recuperacion | rag; el RAG usa el modelo de embeddings de Ollama
      ASSISTANT_CONTEXT_MODE: ${ASSISTANT_CONTEXT_MODE:-completo}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.60}
      GATE_MODEL_URL: ${GATE_MODEL_URL:-}   # endpoint de mlflow models serve (spec 016); vacío = compuerta local
    # Solo para desarrollo: las pruebas (docker compose exec api pytest) leen seed/ y gitops/ en las
    # rutas del repo (/seed, /gitops y /pipelines). La imagen de producción no los lleva.
    volumes:
      - ./seed:/seed:ro
      - ./gitops:/gitops:ro
      - ./pipelines:/pipelines:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Consola de agencia (spec 001): nginx en :5173 (dentro del contenedor, 8080)
  web:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 64m
    build:
      context: ./frontend
      # seed/ entra a la imagen como datos de prueba mientras la API no responde
      additional_contexts:
        seed: ./seed
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      - api

  # ---------- Sitios de los clientes (spec 002) ----------
  # La versión se fija en build (v1 = sana, v2 = rota con HTTP 500). Para pasar un sitio a v2:
  #   RESTAURANTE_VERSION=v2 docker compose up --build -d restaurante

  # Sitio de La Sazón (plantilla landing) en :8081
  restaurante:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 64m
    build:
      context: ./apps/restaurante
      args:
        APP_VERSION: ${RESTAURANTE_VERSION:-v1}
    image: hub/restaurante:${RESTAURANTE_VERSION:-v1}
    ports:
      - "${RESTAURANTE_PORT:-8081}:8080"

  # Sitio de El Tornillo (plantilla landing) en :8082
  ferreteria:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 64m
    build:
      context: ./apps/ferreteria
      args:
        APP_VERSION: ${FERRETERIA_VERSION:-v1}
    image: hub/ferreteria:${FERRETERIA_VERSION:-v1}
    ports:
      - "${FERRETERIA_PORT:-8082}:8080"

  # Sitio de Dental Popayán (plantilla landing-form) en :8083; /api pasa a consultorio-api
  consultorio-web:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 64m
    build:
      context: ./apps/consultorio
      dockerfile: Dockerfile.frontend
      args:
        APP_VERSION: ${CONSULTORIO_VERSION:-v1}
    image: hub/consultorio-web:${CONSULTORIO_VERSION:-v1}
    environment:
      API_UPSTREAM: consultorio-api:8000
    ports:
      - "${CONSULTORIO_PORT:-8083}:8080"
    depends_on:
      - consultorio-api

  # Backend del formulario de citas de Dental Popayán (solo se publica a través de consultorio-web)
  consultorio-api:
    # Límite de memoria: el PC A queda justo de RAM (convenciones, Contenedores)
    mem_limit: 128m
    build:
      context: ./apps/consultorio
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${CONSULTORIO_VERSION:-v1}
    image: hub/consultorio-api:${CONSULTORIO_VERSION:-v1}

volumes:
  db_data:
