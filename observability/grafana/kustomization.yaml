# Grafana (spec 008, T26): explorar métricas y registros, con el tablero «Servicio de los sitios» (SLI y SLO por cliente) ya cargado.
# El usuario administrador sale del Secret grafana-admin (gitops/hub/crear-secretos.sh), nunca del repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - ingress.yaml
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasources.yaml
  - name: grafana-dashboards-provider
    files:
      - dashboards-provider.yaml
  - name: grafana-dashboards
    files:
      - dashboards/servicio-sitios.json
