# Configuración de nginx para el frontend: sirve la SPA y reenvía /api al contenedor de la API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión (auditoría CT-05): sin ella cada primera carga bajaba ~270 KB de JS sin comprimir. La imagen oficial de nginx no la trae activa.
    # Solo texto: las fuentes (woff2) y las imágenes ya vienen comprimidas.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Cabeceras de seguridad también en las respuestas sin `location` propio (los errores)
    include /etc/nginx/seguridad.conf;

    # Resolver de Docker: permite arrancar aunque el contenedor "api" aún no exista
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sondeo de salud de la propia consola (convención: todo servicio expone GET /health). Responde sin pasar por la API ni por index.html (auditoría CT-10).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El asistente tarda hasta 60 s en responder (assistant_timeout_seconds): el proxy espera algo más para devolver el error de la API y no un 504 de nginx (auditoría CT-13)
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Archivos compilados: el nombre lleva un hash, así que se guardan en caché un año.
    # Si no existen se responde 404 (no index.html), para no romper la página tras un despliegue.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/seguridad.conf;
    }

    # Rutas de react-router: cualquier ruta desconocida devuelve index.html.
    # index.html nunca se guarda en caché: así siempre apunta a los archivos del último despliegue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/seguridad.conf;
    }
}
