# Entrada de Gitea (spec 022, T16; auditoría K8-02): Gitea guarda el código, los manifiestos y el registro de imágenes de todos los clientes.
# Solo entran Traefik (gitea.hub.local: runner, personas y el kubelet al bajar imágenes), Argo CD (lee hub-gitops), el Hub y Backstage
# (namespace hub: el Hub escribe como hub-bot, Backstage lee el catálogo) y los Pods del propio namespace (el respaldo). Antes entraba cualquier Pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solo-plataforma-y-propio
  namespace: gitea
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: argocd}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: hub}}
        - podSelector: {}
