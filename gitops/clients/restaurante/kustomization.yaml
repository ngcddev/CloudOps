# Cliente: Restaurante La Sazón · plan Premium (1000m / 1Gi, seed/plans.json) · spec 003 T10.
# Se aplica con `kubectl apply -k gitops/clients/restaurante`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cliente-restaurante
resources:
  - ../_base
images:
  - name: gitea.hub.local/forja-digital/plantilla
    newName: gitea.hub.local/forja-digital/restaurante
    newTag: v1
patches:
  - target: { kind: Namespace }
    patch: |-
      - op: replace
        path: /metadata/name
        value: cliente-restaurante
      - op: replace
        path: /metadata/labels/hub~1client
        value: restaurante
      - op: replace
        path: /metadata/labels/hub~1plan
        value: premium
  - target: { kind: ResourceQuota }
    patch: |-
      - op: replace
        path: /spec/hard/limits.cpu
        value: 1000m
      - op: replace
        path: /spec/hard/limits.memory
        value: 1Gi
  - target: { kind: Ingress }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: restaurante.hub.local
