# Configuración de nginx para el frontend: sirve la SPA y reenvía /api al contenedor de la API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver de Docker: permite arrancar aunque el contenedor "api" aún no exista
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos compilados: el nombre lleva un hash, así que se guardan en caché un año.
    # Si no existen se responde 404 (no index.html), para no romper la página tras un despliegue.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de react-router: cualquier ruta desconocida devuelve index.html.
    # index.html nunca se guarda en caché: así siempre apunta a los archivos del último despliegue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
