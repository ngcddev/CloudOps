# Ingress de Backstage: https://backstage.hub.local (spec 005, T22; HTTPS en la spec 017).
# Por HTTP plano el navegador no ofrece crypto.randomUUID (solo en contextos seguros, y *.hub.local por http no lo es): la interfaz de Backstage mostraba
# «Error in extension 'nav-content:app'» y perdía el menú lateral. Con TLS (certificado autofirmado de Traefik) la página es un contexto seguro; el
# navegador pide aceptar el certificado una vez. En producción iría un certificado real (cert-manager).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [backstage.hub.local]   # sin Secret: Traefik usa su certificado por defecto
  rules:
    - host: backstage.hub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage
                port:
                  name: http
