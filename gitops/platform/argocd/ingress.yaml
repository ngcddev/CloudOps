# Ingress de Argo CD: argocd.hub.local (spec 005, T01). El servidor corre con server.insecure,
# así que Traefik le habla por HTTP en el puerto 80 del Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.hub.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
