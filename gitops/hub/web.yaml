# Consola de agencia del Hub (spec 003 T17): React compilado servido por Nginx sin root en el 8080.
# Las llamadas a /api las enruta el Ingress directamente a la API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hub
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: gitea.hub.local/forja-digital/hub-web:v1
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hub
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
