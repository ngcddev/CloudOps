# Cabeceras de seguridad de la consola (spec 022, T36; auditoría CT-13). Se incluye en cada `location` que añade cabeceras propias: en nginx, un `add_header` dentro
# de un `location` anula los del nivel superior, así que no basta con ponerlas una vez en `server`.
# Content-Security-Policy: solo recursos del propio origen. Los estilos en línea se permiten porque los gráficos SVG y React los usan; los scripts no (Vite no deja ninguno en línea).
# `media-src blob:` es el audio de las respuestas habladas y `connect-src 'self'` la API; `frame-ancestors 'none'` impide incrustar la consola en otra página.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El micrófono solo para esta página (entrada por voz del asistente); cámara y ubicación, nunca
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
