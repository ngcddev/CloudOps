# Configuración de Prometheus (spec 008, T22). Los tiempos suman el peor caso de detección del plan
# (decisión 3): sondeo cada 5 s + evaluación cada 5 s + `for: 30s` + `group_wait: 5s` ≈ 45 s (≤ 60 s).
global:
  scrape_interval: 15s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/reglas/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Sitios de los clientes (decisión 2): se descubren por la anotación hub/probe de su Service y se
  # sondean por dentro del clúster (http://<service>.<namespace>.svc.cluster.local/health) sin depender
  # de que el nodo resuelva *.hub.local. Un cliente nuevo queda monitoreado sin tocar este archivo.
  - job_name: sitios
    metrics_path: /probe
    params:
      module: [http_2xx]
    scrape_interval: 5s
    scrape_timeout: 4s
    kubernetes_sd_configs:
      - role: service
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_hub_probe]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace]
        regex: "(.+);(.+)"
        replacement: "http://$1.$2.svc.cluster.local/health"
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      # El nombre del cliente sale del namespace: cliente-restaurante → restaurante
      - source_labels: [__meta_kubernetes_namespace]
        regex: "cliente-(.+)"
        target_label: client
      - target_label: __address__
        replacement: blackbox.monitoring.svc:9115
